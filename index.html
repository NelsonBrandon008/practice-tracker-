      .ppp-app {

      .ppp-loading { color: var(--silver); padding: 40px 0; text-align: center; }

      .ppp-header {

      .ppp-header-center {

        text-transform: uppercase;
        padding: 5px 13px;
        margin-bottom: 10px;
        border-radius: 999px;
        box-shadow: var(--shadow-sm);

      .ppp-practice-badge-sm {

      .ppp-crest {

      }
      .ppp-brand {
        font-family: var(--font-display);
        font-weight: 900;
        color: var(--red);
        font-size: 29px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        line-height: 1;
      }
      .ppp-header h1 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13.5px;
        margin: 7px 0 0;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--silver);
      }
      .ppp-topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        margin: -20px -16px 22px;
        background: rgba(10, 21, 38, 0.88);
        backdrop-filter: blur(10px) saturate(140%);
        border-bottom: 1px solid var(--line);
      }
      .ppp-topbar-inner {

      .ppp-topbar-text {

      .ppp-topbar-spacer { flex: 1; }

      .ppp-hero-divider {

      }
      .ppp-hero-sec-label {
        color: var(--silver);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }

      .ppp-banner {
        display: flex;
        align-items: center;
        gap: 10px;

        border: 1px solid var(--amber-mid);
        border-radius: var(--radius-md);
        color: var(--white);
        padding: 13px 16px;
        font-family: var(--font-body);
        font-size: 13.5px;
        cursor: pointer;
        text-align: left;
